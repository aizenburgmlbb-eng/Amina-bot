{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<h1>Регистрация</h1>
<form method="post">
    <input name="username" placeholder="Логин" value="{{ username or '' }}" required>
    <input name="email" type="email" placeholder="Email" value="{{ email or '' }}" required>
    <input name="password" type="password" placeholder="Пароль (мин. 8)" required>
    <input name="password2" type="password" placeholder="Повтори пароль" required>
    <button type="submit">Создать аккаунт</button>
</form>
<p>Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
{% endblock %}
