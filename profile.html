{% extends "base.html" %}
{% block title %}Профиль{% endblock %}
{% block content %}
<h1>Привет, {{ user.username }}!</h1>
<p>Email: {{ user.email }}</p>
<p>Твой ID: <code>{{ user.public_id }}</code></p>
<p>Зарегистрирован: {{ user.created_at.strftime("%d.%m.%Y %H:%M") }}</p>
<p><a href="{{ url_for('logout') }}">Выйти</a></p>
{% endblock %}
