<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Сайт{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
        input, button { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; }
        .flash { padding: 10px; margin: 8px 0; border-radius: 6px; }
        .flash.error   { background: #ffe0e0; color: #900; }
        .flash.success { background: #e0ffe4; color: #060; }
        a { color: #2563eb; }
    </style>
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
            <div class="flash {{ cat }}">{{ msg }}</div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</body>
</html>
